name: Publish to npm

# Publishes on a v* tag using npm trusted publishing: GitHub Actions
# authenticates over OIDC, so no npm token is stored anywhere and npm generates
# a provenance attestation automatically for this public repo.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC; publishing fails without it

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing requires a GitHub-hosted runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # setup-node ships an npm older than trusted publishing needs (>= 11.5.1).
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - run: npm test

      # A mistyped tag would otherwise publish a version nobody expects, and a
      # published version can never be reused.
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          echo "tag=$tag package.json=$pkg"
          test "$tag" = "$pkg" || { echo "::error::tag $GITHUB_REF_NAME does not match package.json $pkg"; exit 1; }

      - run: npm publish
